<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal</title>
  </head>
  <body>
    <header class="bar">
      <strong class="brand">Signal</strong>
      <label>Asset <select id="symbol"></select></label>
      <label>Timeframe <select id="interval"></select></label>
      <label title="Use Jev as a judge that can veto indicator signals">
        <input type="checkbox" id="useJev" checked /> Jev filter
      </label>
      <label>Leverage <input id="leverage" type="number" min="1" max="100" step="1" value="5" /></label>
      <label>Risk %/trade <input id="riskPct" type="number" min="0.1" max="10" step="0.1" value="1" /></label>
      <label>Min confluence <input id="minScore" type="number" min="1" max="5" step="1" value="4" /></label>
      <button id="run">Run</button>
      <span id="status" class="status"></span>
    </header>
    <main class="layout">
      <section class="charts">
        <div id="chart" class="chart"></div>
        <div id="equity" class="equity"></div>
      </section>
      <aside class="panel">
        <div class="card" id="latest"></div>
        <div class="card">
          <h3>Backtest</h3>
          <table id="stats"></table>
          <p class="note">Fills at next bar open, with fees, slippage, ATR stops and isolated-margin liquidation. Past performance does not predict future results.</p>
        </div>
        <div class="card">
          <h3>Recent trades</h3>
          <table id="trades" class="trades"></table>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
